name: Deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      force_native:
        description: 'Force full EAS build instead of OTA'
        required: false
        default: false
        type: boolean

jobs:
  # ── Detect whether any native-layer files changed ──────────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      native_changed: ${{ steps.check.outputs.native_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect native changes
        id: check
        run: |
          # Manual override via workflow_dispatch
          if [[ "${{ github.event.inputs.force_native }}" == "true" ]]; then
            echo "native_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # On first commit HEAD~1 won't exist — treat as native to be safe
          if ! git rev-parse HEAD~1 > /dev/null 2>&1; then
            echo "No previous commit — treating as native build"
            echo "native_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          NATIVE=false
          while IFS= read -r file; do
            case "$file" in
              # Dependency / config files that can pull in native modules
              package.json|yarn.lock|eas.json|app.json|app.config.js| \
              babel.config.js|metro.config.js)
                NATIVE=true
                break
                ;;
              # Native platform directories
              android/*|ios/*)
                NATIVE=true
                break
                ;;
            esac
          done <<< "$CHANGED"

          echo "native_changed=$NATIVE" >> $GITHUB_OUTPUT

  # ── JS-only changes → OTA update (instant, no install required) ────────────
  ota-update:
    needs: detect
    if: needs.detect.outputs.native_changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: corepack enable

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: $(yarn config get cacheFolder)
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - run: yarn install --immutable

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        env:
          # Passed via env instead of interpolated directly into the script
          # below — ${{ github.event.head_commit.message }} substituted
          # literally into `run:` text means any quote, paren, backtick, or
          # newline in the commit message (multi-paragraph messages have
          # all of these) corrupts the surrounding shell string and gets
          # parsed as stray extra arguments to `eas update` ("Unexpected
          # arguments"). Env vars are passed as real values, not spliced
          # into the script text, so this is immune to message content.
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          # Only the commit subject (first line) — the update message
          # shouldn't be a multi-paragraph body, and eas update's --message
          # doesn't handle embedded newlines well either.
          SUBJECT="${COMMIT_MESSAGE%%$'\n'*}"
          eas update \
            --branch production \
            --message "OTA ${SHORT_SHA}: ${SUBJECT}" \
            --non-interactive

  # ── Native changes → full EAS build, then submit once it's finished ────────
  native-build:
    needs: detect
    if: needs.detect.outputs.native_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: corepack enable

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: $(yarn config get cacheFolder)
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - run: yarn install --immutable

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write Android service account key
        run: |
          mkdir -p android
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}' > android/zepira-390c2fd69214.json

      # Blocks until both platform builds finish (no --no-wait) so the
      # submit step below only ever runs against builds CI has directly
      # confirmed succeeded, and a failed build fails this job instead of
      # silently never submitting anything. If either platform fails,
      # `eas build` exits non-zero and the submit step is skipped
      # entirely — deliberate: submitting only one platform while the
      # other silently failed would leave the two stores out of sync.
      - name: Build (waits for both platforms to finish)
        run: |
          eas build \
            --platform all \
            --profile production \
            --non-interactive

      - name: Submit finished builds to their app stores
        run: |
          eas submit --platform android --profile production --latest --non-interactive --no-wait
          eas submit --platform ios --profile production --latest --non-interactive --no-wait
